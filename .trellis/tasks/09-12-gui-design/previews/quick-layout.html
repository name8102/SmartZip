<style>
#sz-quick-layout{--q-bg:light-dark(#ffffff,#202428);--q-surface:light-dark(#f5f7f8,#292e33);--q-ink:light-dark(#202b30,#eaf0f2);--q-sub:light-dark(#65747c,#a6b5bd);--q-line:light-dark(#e6ecee,#3a444a);--q-accent:light-dark(#237769,#8bddc7);--q-soft:light-dark(#edf7f3,#293f38);--q-on:light-dark(#ffffff,#15342a);--q-warn:light-dark(#94652a,#e8ba7e);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--q-ink);width:100%}
#sz-quick-layout *{box-sizing:border-box}#sz-quick-layout .q-window{max-width:396px;margin:4px auto 20px;background:var(--q-bg);border:1px solid var(--q-line);border-radius:16px;box-shadow:0 12px 38px light-dark(#1e384512,#00000035);overflow:hidden}#sz-quick-layout button,#sz-quick-layout select{font:inherit;color:inherit}#sz-quick-layout button{border:0;background:transparent;cursor:pointer;padding:7px 10px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:7px}#sz-quick-layout button:hover{background:var(--q-surface)}#sz-quick-layout .q-title{display:flex;align-items:center;gap:8px;padding:15px 16px;background:var(--q-surface)}#sz-quick-layout .q-dots{display:flex;gap:6px;margin-right:10px}#sz-quick-layout .q-dots span{width:9px;height:9px;border-radius:50%;background:var(--q-line)}#sz-quick-layout .q-title strong{font-weight:500}#sz-quick-layout .q-title small{margin-left:auto;color:var(--q-sub);font-size:11px}#sz-quick-layout .q-body{padding:22px}#sz-quick-layout .q-drop{width:100%;border:1px dashed var(--q-accent);border-radius:12px;background:var(--q-soft);display:flex;flex-direction:column;gap:9px;padding:29px 14px 25px;color:var(--q-accent)}#sz-quick-layout .q-drop:hover{background:var(--q-soft)}#sz-quick-layout .q-drop svg{width:27px;height:27px;margin-bottom:4px}#sz-quick-layout .q-drop strong{font-size:18px;font-weight:500;color:var(--q-ink)}#sz-quick-layout .q-small{font-size:12px;color:var(--q-sub)}#sz-quick-layout .q-row{display:flex;align-items:center;gap:9px;min-width:0}#sz-quick-layout .q-between{justify-content:space-between}#sz-quick-layout .q-config{margin:18px 0 23px}#sz-quick-layout .q-config svg,#sz-quick-layout button svg{width:16px;height:16px;flex-shrink:0}#sz-quick-layout .q-config label{display:flex;align-items:center;gap:8px;font-size:12px;margin:11px 0 0;color:var(--q-sub)}#sz-quick-layout select{width:100%;min-width:0;background:var(--q-surface);border:1px solid var(--q-line);padding:8px;border-radius:7px}#sz-quick-layout .q-settings{display:grid;gap:11px;padding:10px 0}#sz-quick-layout input{accent-color:var(--q-accent)}#sz-quick-layout .q-divider{height:1px;background:var(--q-line);margin:18px 0}#sz-quick-layout .q-label{font-size:11px;color:var(--q-sub);letter-spacing:1px;margin:0 0 15px}#sz-quick-layout .q-file{display:flex;align-items:center;gap:12px}#sz-quick-layout .q-fileicon{width:39px;height:43px;display:grid;place-items:center;background:var(--q-surface);border-radius:8px;color:var(--q-accent)}#sz-quick-layout .q-fileicon svg{width:21px;height:21px}#sz-quick-layout .q-file strong{font-weight:500}#sz-quick-layout .q-file p{margin:3px 0 0}#sz-quick-layout .q-track{height:5px;background:var(--q-line);border-radius:4px;margin:17px 0 9px;overflow:hidden}#sz-quick-layout .q-track span{display:block;height:100%;width:62%;background:var(--q-accent)}#sz-quick-layout .q-progress{font-size:12px;color:var(--q-accent);font-variant-numeric:tabular-nums}#sz-quick-layout .q-wait{display:flex;align-items:center;gap:9px;background:var(--q-surface);padding:11px 12px;border-radius:8px;margin-top:20px;font-size:12px}#sz-quick-layout .q-wait svg{width:15px;height:15px;color:var(--q-warn)}#sz-quick-layout .q-wait span:last-child{margin-left:auto;color:var(--q-sub)}#sz-quick-layout footer{border-top:1px solid var(--q-line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--q-surface)}#sz-quick-layout .q-link{color:var(--q-accent);font-size:12px}#sz-quick-layout [hidden]{display:none!important}@media(max-width:380px){#sz-quick-layout .q-body{padding:17px}#sz-quick-layout .q-title{padding:12px}#sz-quick-layout .q-config .q-row{flex-wrap:wrap}}@media(pointer:coarse){#sz-quick-layout button{min-height:44px}#sz-quick-layout select{font-size:16px}}
#sz-quick-layout .q-toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}#sz-quick-layout .q-toggles label{display:flex;align-items:center;gap:7px;margin:0;padding:9px 10px;border:1px solid var(--q-line);border-radius:8px;background:var(--q-bg);color:var(--q-sub);cursor:pointer;font-size:12px}#sz-quick-layout .q-toggles label:has(input:checked){background:var(--q-soft);border-color:var(--q-accent);color:var(--q-accent)}#sz-quick-layout .q-toggles label svg{width:15px;height:15px;flex:none}#sz-quick-layout .q-toggles input{width:13px;height:13px;margin:0 0 0 auto;flex:none}#sz-quick-layout .q-config-note{margin:9px 0 0;font-size:11px;color:var(--q-sub);min-height:16px}#sz-quick-layout .q-engine{display:flex;gap:6px;align-items:center;color:var(--q-sub);font-size:11px;margin-top:11px}#sz-quick-layout .q-engine svg{width:13px;height:13px}#sz-quick-layout .q-engine span:last-child{margin-left:auto}#sz-quick-layout .q-config{margin-bottom:15px}#sz-quick-layout .q-drop{padding-top:23px;padding-bottom:21px}@media(pointer:coarse){#sz-quick-layout .q-toggles label{min-height:44px}}
</style>
<div id="sz-quick-layout" aria-label="SmartZip 快速操作窗口布局预览">
  <section class="q-window">
    <header class="q-title"><span class="q-dots" aria-hidden="true"><span></span><span></span><span></span></span><strong>SmartZip</strong><small>快速窗口 · 布局预览</small></header>
    <div class="q-body">
      <button type="button" class="q-drop" aria-label="演示添加一个归档"><i data-lucide="package-open" aria-hidden="true"></i><strong>拖进来，就开始解压</strong><span class="q-small">或点击选择压缩包</span></button>
      <div class="q-config"><div class="q-row q-between"><span class="q-row q-small"><i data-lucide="folder-output" aria-hidden="true"></i>输出到首个文件所在目录</span><button type="button" class="q-link" id="q-config-toggle" aria-expanded="false" aria-controls="q-settings"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>更多</button></div><div class="q-toggles" aria-label="下一次任务的快速配置"><label><i data-lucide="layers" aria-hidden="true"></i>递归解压<input type="checkbox" checked></label><label><i data-lucide="folder-check" aria-hidden="true"></i>智能整理<input type="checkbox" id="q-smart"></label><label data-tooltip="全部成功后将原包移入回收站；失败或取消时保留。此处仅演示开关。"><i data-lucide="trash-2" aria-hidden="true"></i>解压后删除<input type="checkbox" id="q-delete" aria-describedby="q-option-note"></label><label><i data-lucide="languages" aria-hidden="true"></i>自动编码<input type="checkbox" checked></label></div><p class="q-config-note" id="q-option-note" aria-live="polite">仅影响下一次任务 · 原包保留</p><div class="q-settings" id="q-settings" hidden><label>同名文件<select aria-label="同名文件处理"><option>询问</option><option>自动重命名</option><option>跳过</option></select></label><label>最大递归深度<select aria-label="最大递归深度"><option>3 层</option><option>5 层</option><option>8 层</option></select></label></div></div>
      <div class="q-divider"></div><p class="q-label">正在处理</p>
      <div class="q-file"><span class="q-fileicon"><i data-lucide="file-archive" aria-hidden="true"></i></span><div><strong>旅行照片 · 京都.7z</strong><p class="q-small">正在解压当前归档</p></div><button type="button" id="q-stop" style="margin-left:auto" aria-label="取消示例任务"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="q-track" role="progressbar" aria-label="当前归档进度" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span></span></div><div class="q-row q-between"><span class="q-small" id="q-stage" aria-live="polite">已发现 3 个内层归档</span><span class="q-progress">62%</span></div>
      <div class="q-engine"><i data-lucide="cpu" aria-hidden="true"></i><span>后端：7-Zip / 7zz</span><span>自动选择</span></div>
      <div class="q-wait"><i data-lucide="key-round" aria-hidden="true"></i><span>工作文档.zip 需要密码</span><span>待处理</span></div>
    </div>
    <footer><span class="q-small" id="q-count">另外 2 项排队中</span><button type="button" class="q-link" id="q-all">查看全部任务<i data-lucide="arrow-up-right" aria-hidden="true"></i></button></footer>
  </section>
</div>
<script>
(()=>{const root=document.getElementById('sz-quick-layout');const settings=root.querySelector('#q-settings');root.querySelector('#q-config-toggle').onclick=e=>{settings.hidden=!settings.hidden;e.currentTarget.setAttribute('aria-expanded',String(!settings.hidden));};root.querySelector('#q-delete').onchange=e=>{root.querySelector('#q-option-note').textContent=e.target.checked?'仅影响下一次任务 · 全部成功后原包移入回收站':'仅影响下一次任务 · 原包保留';};let count=2;root.querySelector('.q-drop').onclick=()=>{root.querySelector('#q-count').textContent=`另外 ${++count} 项排队中（示例）`;};root.querySelector('#q-stop').onclick=()=>{root.querySelector('#q-stage').textContent='正在停止并清理（示例）';root.querySelector('.q-progress').textContent='取消中';};root.querySelector('#q-all').onclick=()=>{root.querySelector('#q-stage').textContent='详细任务布局见下方预览';};const state={radius:16,soft:true};function apply(){root.querySelector('.q-window').style.borderRadius=state.radius+'px';root.querySelector('.q-drop').style.background=state.soft?'var(--q-soft)':'var(--q-bg)';}if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:apply});tweak.addSlider(state,'radius',{label:'窗口圆角',min:4,max:24,unit:'px'});tweak.addToggle(state,'soft',{label:'柔和投递区'});}})();
</script>
