<style>
#smartzip-design{--sz-bg:light-dark(#f5f6f7,#191c20);--sz-panel:light-dark(#ffffff,#23272d);--sz-text:light-dark(#202833,#ecf0f4);--sz-muted:light-dark(#68717e,#aab4c0);--sz-line:light-dark(#e3e7ec,#383e47);--sz-accent:light-dark(#276c60,#7ad1b8);--sz-on-accent:light-dark(#ffffff,#132b24);--sz-soft:light-dark(#eaf3ef,#263d35);--sz-warn:light-dark(#946414,#f3c46c);--sz-danger:light-dark(#b14941,#ffa69b);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--sz-text);width:100%;color-scheme:light dark}#smartzip-design *{box-sizing:border-box}#smartzip-design button,#smartzip-design input,#smartzip-design select{font:inherit}#smartzip-design button{cursor:pointer;border:1px solid var(--sz-line);border-radius:7px;background:var(--sz-panel);color:var(--sz-text);padding:7px 11px}#smartzip-design button:hover{background:var(--sz-soft)}#smartzip-design button:disabled{opacity:.5;cursor:default}#smartzip-design .primary{background:var(--sz-accent);border-color:var(--sz-accent);color:var(--sz-on-accent)}#smartzip-design .quiet{background:transparent;border-color:transparent}#smartzip-design .danger{color:var(--sz-danger)}#smartzip-design .muted{color:var(--sz-muted);font-size:12px}#smartzip-design .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}#smartzip-design .modes{display:flex;gap:4px;padding:3px;background:var(--sz-bg);border-radius:9px}#smartzip-design .modes button{border-color:transparent;background:transparent}#smartzip-design .modes button[aria-pressed=true]{background:var(--sz-panel);border-color:var(--sz-line)}#smartzip-design .window{background:var(--sz-panel);border:1px solid var(--sz-line);border-radius:12px;overflow:hidden;position:relative}#smartzip-design .chrome{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--sz-bg);padding:13px 17px;border-bottom:1px solid var(--sz-line)}#smartzip-design .brand{font-weight:500;display:flex;align-items:center;gap:9px}#smartzip-design .brandmark{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:7px;background:var(--sz-accent);color:var(--sz-on-accent)}#smartzip-design .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}#smartzip-design .between{justify-content:space-between}#smartzip-design .shell{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:560px}#smartzip-design .sidebar{background:var(--sz-bg);border-right:1px solid var(--sz-line);padding:18px 10px;display:flex;flex-direction:column;gap:5px}#smartzip-design .sidebar button{text-align:left;display:flex;align-items:center;gap:10px;border-color:transparent;background:transparent}#smartzip-design .sidebar button[aria-current=page]{background:var(--sz-soft);color:var(--sz-accent)}#smartzip-design .sidebar .group{padding:13px 10px 5px;color:var(--sz-muted);font-size:12px}#smartzip-design .sidebar .foot{margin-top:auto;padding:35px 10px 0;font-size:12px;color:var(--sz-muted)}#smartzip-design .main{min-width:0}#smartzip-design .pagehead{padding:23px 24px 18px;border-bottom:1px solid var(--sz-line)}#smartzip-design h2{font-size:20px;font-weight:500;line-height:1.4;margin:0 0 5px}#smartzip-design h3{font-size:14px;font-weight:500;margin:0}#smartzip-design p{margin:5px 0}#smartzip-design .workarea{display:grid;grid-template-columns:minmax(0,1fr) 264px;min-height:460px}#smartzip-design .tasklist{padding:12px;min-width:0}#smartzip-design .sectionlabel{font-size:12px;color:var(--sz-muted);padding:8px 7px}#smartzip-design .task{display:block;width:100%;text-align:left;padding:14px 12px;margin-bottom:6px;border-color:transparent;background:transparent}#smartzip-design .task.selected{background:var(--sz-soft);border-color:var(--sz-line)}#smartzip-design .filename{font-weight:500;overflow-wrap:anywhere}#smartzip-design .tag{font-size:11px;white-space:nowrap;color:var(--sz-muted)}#smartzip-design .active{color:var(--sz-accent)}#smartzip-design .warning{color:var(--sz-warn)}#smartzip-design .progress{height:5px;background:var(--sz-line);border-radius:4px;margin:10px 0 7px;overflow:hidden}#smartzip-design .progress span{display:block;height:100%;width:62%;background:var(--sz-accent);border-radius:4px}#smartzip-design .detail{padding:22px 18px;border-left:1px solid var(--sz-line);background:var(--sz-bg);min-width:0}#smartzip-design .divider{height:1px;background:var(--sz-line);margin:18px 0}#smartzip-design .kv{margin:13px 0}#smartzip-design .kv dt{font-size:12px;color:var(--sz-muted)}#smartzip-design .kv dd{margin:4px 0 0;overflow-wrap:anywhere}#smartzip-design .event{font-size:12px;color:var(--sz-muted);padding:7px 0;border-bottom:1px solid var(--sz-line)}#smartzip-design .pagebody{padding:22px 24px}#smartzip-design .tablewrap{overflow-x:auto}#smartzip-design table{border-collapse:collapse;width:100%;font-size:13px}#smartzip-design th{text-align:left;color:var(--sz-muted);font-weight:400;font-size:12px}#smartzip-design td,#smartzip-design th{padding:13px 10px;border-bottom:1px solid var(--sz-line);vertical-align:middle}#smartzip-design .emptyline{border:1px dashed var(--sz-line);border-radius:9px;padding:17px;margin:15px 0;color:var(--sz-muted)}#smartzip-design .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}#smartzip-design label.field{display:grid;gap:7px;font-size:12px;color:var(--sz-muted)}#smartzip-design input:not([type=checkbox]),#smartzip-design select{width:100%;border:1px solid var(--sz-line);border-radius:6px;background:var(--sz-panel);color:var(--sz-text);padding:8px 10px;min-width:0}#smartzip-design .check{display:flex;gap:9px;align-items:center;padding:8px 0}#smartzip-design input[type=checkbox]{accent-color:var(--sz-accent)}#smartzip-design .settingsgroup{margin:0 0 25px}#smartzip-design .settingsgroup h3{margin-bottom:13px}#smartzip-design .quick{max-width:400px;margin:0 auto;min-height:540px}#smartzip-design .quickbody{padding:22px}#smartzip-design .drop{padding:29px 12px;border:1px dashed var(--sz-accent);background:var(--sz-soft);border-radius:10px;text-align:center;margin-bottom:18px}#smartzip-design .drop.drag{outline:2px solid var(--sz-accent);outline-offset:3px}#smartzip-design .drop .dropicon{font-size:29px;font-weight:400;color:var(--sz-accent);margin-bottom:9px}#smartzip-design .quicktask{padding:14px 0}#smartzip-design .quickfoot{padding:12px 20px;background:var(--sz-bg);border-top:1px solid var(--sz-line)}#smartzip-design .config{background:var(--sz-bg);padding:14px;border-radius:8px;margin:12px 0}#smartzip-design .overlay{position:absolute;inset:0;z-index:5;background:light-dark(#20283366,#00000099);display:flex;align-items:flex-start;justify-content:center;padding:85px 18px 24px}#smartzip-design .dialog{background:var(--sz-panel);border:1px solid var(--sz-line);border-radius:12px;padding:24px;width:380px;max-width:100%;box-shadow:0 10px 35px light-dark(#17222022,#00000066)}#smartzip-design .dialog h2{font-size:18px}#smartzip-design .notice{padding:11px 16px;background:var(--sz-soft);color:var(--sz-accent);font-size:12px;border-top:1px solid var(--sz-line)}#smartzip-design [hidden]{display:none!important}#smartzip-design .icon{width:17px;height:17px}#smartzip-design .pill{padding:2px 7px;border-radius:4px;background:var(--sz-bg);font-size:11px;color:var(--sz-muted)}#smartzip-design .tabrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px}#smartzip-design .tabrow button[aria-pressed=true]{background:var(--sz-soft);color:var(--sz-accent)}#smartzip-design .settingNote{margin-top:9px;font-size:12px;color:var(--sz-muted)}@media(max-width:900px){#smartzip-design .shell{grid-template-columns:145px minmax(0,1fr)}#smartzip-design .workarea{grid-template-columns:1fr}#smartzip-design .detail{border-left:0;border-top:1px solid var(--sz-line)}#smartzip-design .detail dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}#smartzip-design .detail .kv{margin:0}}@media(max-width:570px){#smartzip-design .shell{grid-template-columns:1fr}#smartzip-design .sidebar{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--sz-line);padding:8px}#smartzip-design .sidebar .group,#smartzip-design .sidebar .foot{display:none}#smartzip-design .sidebar button{padding:7px 9px}#smartzip-design .pagehead,#smartzip-design .pagebody{padding:18px 15px}#smartzip-design .formgrid{grid-template-columns:1fr}#smartzip-design .chrome{padding:10px 13px}#smartzip-design .chrome .muted{display:none}#smartzip-design .quickbody{padding:16px}#smartzip-design .detail dl{grid-template-columns:1fr}#smartzip-design .overlay{padding-top:28px}}@media(pointer:coarse){#smartzip-design button{min-height:44px}#smartzip-design input,#smartzip-design select{font-size:16px}}
</style>
<div id="smartzip-design" aria-label="SmartZip 双窗口界面设计">
  <div class="top"><div class="modes" aria-label="窗口模式"><button type="button" data-mode="quick" aria-pressed="false">快速窗口</button><button type="button" data-mode="full" aria-pressed="true">详细窗口</button></div><span class="muted">交互设计稿 · 所有操作仅为模拟</span></div>
  <section class="window" id="sz-full" aria-label="SmartZip 详细窗口">
    <header class="chrome"><span class="brand"><span class="brandmark">S</span> SmartZip <span class="muted">工作台</span></span><div class="row"><span class="muted">本地处理</span><button type="button" class="quiet" data-mode="quick">切换快速窗口 ↗</button></div></header>
    <div class="shell"><nav class="sidebar" aria-label="主要导航"><div class="group">工作空间</div><button type="button" data-page="tasks" aria-current="page"><i data-lucide="layers" aria-hidden="true"></i>任务队列</button><button type="button" data-page="history"><i data-lucide="history" aria-hidden="true"></i>历史记录</button><button type="button" data-page="preview"><i data-lucide="folder-open" aria-hidden="true"></i>归档预览</button><div class="group">管理</div><button type="button" data-page="passwords"><i data-lucide="key-round" aria-hidden="true"></i>密码管理</button><button type="button" data-page="settings"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>设置</button><div class="foot">解压引擎 · 本地运行<br>压缩功能尚未接入</div></nav><main class="main" id="sz-content"></main></div>
    <div class="notice" id="sz-status" aria-live="polite">正在解压 1 项 · 等待密码 1 项 · 排队 2 项</div>
    <div class="overlay" id="sz-modal" hidden></div>
  </section>
  <section class="window quick" id="sz-quick" aria-label="SmartZip 快速窗口" hidden><header class="chrome"><span class="brand"><span class="brandmark">S</span>SmartZip</span><button type="button" class="quiet" data-mode="full">工作台 ↗</button></header><div class="quickbody"><div class="drop" id="sz-drop"><div class="dropicon">↓</div><h3>将压缩包拖到这里</h3><p class="muted">支持多个文件、文件夹与分卷入口</p><button type="button" class="quiet active" data-act="add">选择文件（模拟）</button></div><div class="row between"><span class="muted">输出到本次首个输入的父目录</span><button type="button" class="quiet" data-act="quickconfig" aria-expanded="false">快速配置</button></div><div id="sz-quickconfig" class="config" hidden><label class="field">输出位置<select><option>本次首个输入的父目录</option><option>下载文件夹 / 已解压</option></select></label><label class="check"><input type="checkbox" checked>递归解压嵌套压缩包</label><label class="field">目标已存在时<select><option>自动重命名</option><option>询问</option><option>跳过</option><option>覆盖</option></select></label><p class="settingNote">仅应用于下一次投递 · <button type="button" class="quiet" data-page="settings">更多设置 ↗</button></p></div><div class="divider"></div><div class="quicktask"><div class="row between"><span class="filename">项目素材.7z</span><span class="tag active" id="sz-quickstate">解压中</span></div><div class="progress" role="progressbar" aria-label="当前归档项目素材.7z解压进度" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span></span></div><div class="row between"><span class="muted">当前归档 62%</span><span class="muted">1.24 / 2.00 GB</span></div><p class="muted">递归扫描中 · 已发现 3 个归档，总量待定</p><div class="row between" style="margin-top:16px"><span class="muted" id="sz-quickcount">另有 3 个任务</span><button type="button" class="quiet danger" data-act="cancel">取消当前任务</button></div></div><button type="button" style="width:100%" data-act="password">工作文档.zip 需要密码 →</button></div><footer class="quickfoot row between"><span class="muted">关闭窗口后继续处理</span><button type="button" class="quiet" data-mode="full">查看全部任务</button></footer></section>
</div>
<script>
(()=>{
const root=document.getElementById('smartzip-design');const content=root.querySelector('#sz-content');
const state={mode:'full',page:'tasks',paused:false,selected:0,canceled:false,unlocked:false,added:0,settingsTab:'general',radius:12,density:'舒适',accent:'森林绿',keys:['常用归档','项目交付'],previewFolder:false};
const tasks=[{name:'项目素材.7z',type:'7z · 2.00 GB',status:'解压中',path:'下载 / 项目素材',detail:'解压当前归档',when:'今天 14:32'},{name:'工作文档.zip',type:'ZIP · 84.6 MB',status:'等待密码',path:'下载 / 工作文档',detail:'需要密码以继续列出条目',when:'今天 14:33'},{name:'照片备份.part01.rar',type:'RAR 分卷 · 6 卷',status:'排队中',path:'下载 / 照片备份',detail:'分卷已归组，仅建立一个任务',when:'今天 14:34'},{name:'资料合集.tar.gz',type:'TAR + GZIP · 412 MB',status:'排队中',path:'下载 / 资料合集',detail:'待调度执行',when:'今天 14:35'}];
const taskStatus=i=>i===0&&state.canceled?'正在取消 / 清理':i===1&&state.unlocked?'解压中':tasks[i].status;
const head=(title,desc,actions='')=>`<div class="pagehead"><div class="row between"><div><h2>${title}</h2><p class="muted">${desc}</p></div><div class="row">${actions}</div></div></div>`;
function notice(text){root.querySelector('#sz-status').textContent=text;}
function taskPage(){const task=tasks[state.selected];return head('任务队列','每次投递建立一个批次，支持递归解压与分卷归组。',`<button type="button" data-act="pause">${state.paused?'恢复调度':'暂停调度'}</button><button type="button" class="primary" data-act="add">＋ 添加任务</button>`)+`<div class="workarea"><div class="tasklist"><div class="sectionlabel">${state.paused?'调度已暂停 · 正在运行的任务继续':'自动调度 · 并发上限 2（自定义）'}</div>${tasks.map((t,i)=>`<button type="button" class="task ${i===state.selected?'selected':''}" data-task="${i}" aria-pressed="${i===state.selected}"><div class="row between"><span class="filename">${t.name}</span><span class="tag ${i===0?'active':i===1?'warning':''}">${taskStatus(i)}</span></div><p class="muted">${t.type}</p>${i===0&&!state.canceled?'<div class="progress" role="progressbar" aria-label="当前归档解压进度" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span></span></div><div class="row between"><span class="muted">当前归档 62% · 1.24 / 2.00 GB</span></div><p class="muted">递归总量待定 · 已发现 3 个归档</p>':`<p class="muted">${i===1&&!state.unlocked?'输入密码后继续 · 占用并发槽':'输出到 '+t.path}</p>`}</button>`).join('')}${state.added?`<div class="emptyline">已添加 ${state.added} 个演示任务 · 等待调度</div>`:''}<div class="emptyline">拖入更多文件或文件夹<br><span class="muted">本设计稿不读取文件</span></div></div><aside class="detail"><div class="row between"><h3>任务详情</h3><span class="pill">#00${state.selected+1}</span></div><div class="divider"></div><div class="filename">${task.name}</div><dl><div class="kv"><dt>当前状态</dt><dd>${taskStatus(state.selected)}</dd></div><div class="kv"><dt>输出目录</dt><dd>${task.path}</dd></div><div class="kv"><dt>解压策略</dt><dd>递归解压 · 自动重命名</dd></div><div class="kv"><dt>归档阶段</dt><dd>${task.detail}</dd></div></dl><div class="row">${state.selected===1&&!state.unlocked?'<button type="button" class="primary" data-act="password">输入密码</button>':''}<button type="button" data-page="preview">归档预览示例</button>${state.selected===0&&!state.canceled?'<button type="button" class="quiet danger" data-act="cancel">取消</button>':''}</div><div class="divider"></div><h3>活动记录</h3><div class="event">${task.when}　任务已提交</div><div class="event">${state.selected===0?'14:32:04　识别归档成功':'14:33:02　'+task.detail}</div>${state.selected===0?'<div class="event">14:32:05　开始解压，输出暂存中</div>':''}<p class="muted" style="margin-top:15px">完成提交后才报告成功。</p></aside></div>`;}
function historyPage(){return head('历史记录','按最终结果回看任务、逐文件结果与事件。')+`<div class="pagebody"><div class="tablewrap"><table><thead><tr><th>归档</th><th>结果</th><th>完成时间</th><th>操作</th></tr></thead><tbody><tr><td><button type="button" class="quiet filename" data-act="filehistory">设计交付.zip ↗</button><p class="muted">下载 / 设计交付 · 142 个文件</p></td><td class="active">已完成</td><td>今天 13:20</td><td><button type="button" data-act="output">打开目录</button></td></tr><tr><td><button type="button" class="quiet filename" data-act="partial">素材归档.zip ↗</button><p class="muted">120 个完成 · 2 个跳过 · 1 个失败</p></td><td class="warning">部分完成</td><td>今天 12:10</td><td><button type="button" data-act="retry">重新提交</button></td></tr><tr><td><span class="filename">老照片.rar</span><p class="muted">分卷缺失 · part03.rar</p></td><td class="danger">失败</td><td>昨天 20:18</td><td><button type="button" data-act="retry">重新提交</button></td></tr><tr><td><span class="filename">临时资料.7z</span><p class="muted">由用户取消 · 暂存已清理</p></td><td class="muted">已取消</td><td>昨天 19:42</td><td><button type="button" data-act="retry">重新提交</button></td></tr></tbody></table></div><div class="divider"></div><div class="row between"><p class="muted">历史记录不保存密码内容。</p><button type="button" class="quiet" data-act="clearhistory">清理历史记录…</button></div></div>`;}
function previewPage(){return head('归档预览','先查看目录与条目，再决定如何解压。','<button type="button" data-act="test">完整性测试</button><button type="button" data-act="add">解压整个归档</button>')+`<div class="pagebody"><div class="row between"><span class="filename">项目素材.7z <span class="pill">7z</span></span><span class="muted">${state.previewFolder?'4 个条目':'3 个顶层条目'} · 解压后 2.00 GB</span></div><div class="divider"></div><button type="button" class="quiet" data-act="rootfolder">项目素材.7z</button>${state.previewFolder?' / assets':''}<div class="tablewrap"><table><thead><tr><th>名称</th><th>类型</th><th>大小</th></tr></thead><tbody>${state.previewFolder?'<tr><td>cover.png</td><td>PNG 图片</td><td>4.8 MB</td></tr><tr><td>logo.svg</td><td>SVG 图形</td><td>28 KB</td></tr><tr><td>source.psd</td><td>PSD 文件</td><td>1.62 GB</td></tr><tr><td>textures.zip</td><td>嵌套归档</td><td>375 MB</td></tr>':'<tr><td><button type="button" class="quiet" data-act="folder">▸ assets</button></td><td>文件夹</td><td>—</td></tr><tr><td>README.md</td><td>Markdown</td><td>2.4 KB</td></tr><tr><td>交付说明.pdf</td><td>PDF 文档</td><td>382 KB</td></tr>'}</tbody></table></div><p class="muted" style="margin-top:19px">格式：7z · 编码：UTF-8 · 未加密 · 未检测到内嵌归档</p><div class="row"><button type="button" data-act="encoding">编码对比</button><button type="button" data-act="embedded">内嵌归档策略</button></div><p class="muted">此处展示归档目录和条目元数据；文件内容预览尚未接入。</p></div>`;}
function passwordsPage(){return head('密码管理','候选密码 · 默认隐藏 · 任务需要时安全输入。','<button type="button" class="primary" data-act="newkey">＋ 添加密码</button>')+`<div class="pagebody"><div class="tablewrap"><table><thead><tr><th>名称 / 来源</th><th>密码</th><th>操作</th></tr></thead><tbody>${state.keys.map((k,i)=>`<tr><td>${k}<p class="muted">手动添加 · 成功使用 3 次</p></td><td aria-label="密码已隐藏">••••••••</td><td><button type="button" class="quiet" disabled>置顶（待接入）</button><button type="button" class="quiet danger" data-deletekey="${i}">移除</button></td></tr>`).join('')}</tbody></table></div><div class="divider"></div><div class="row between"><div><h3>待处理的密码请求</h3><p class="muted">${state.unlocked?'没有待处理请求':'工作文档.zip · 等待输入'}</p></div>${state.unlocked?'':'<button type="button" data-act="password">处理请求</button>'}</div><div class="row" style="margin-top:24px"><button type="button" data-act="importkeys">导入</button><button type="button" data-act="exportkeys">导出…</button><button type="button" data-act="cleankeys">清理预览</button></div><p class="muted">密码默认隐藏。活动记录与错误信息不显示密码。</p></div>`;}
function settingsPage(){const tabs={general:'解压策略',limits:'资源与安全',backend:'引擎与高级',advanced:'递归与交互'};let panel='';if(state.settingsTab==='general')panel=`<div class="settingsgroup"><h3>新任务默认值</h3><div class="formgrid"><label class="field">默认输出位置<select><option>本次首个输入的父目录</option><option>自定义目录</option></select></label><label class="field">输出布局<select><option>保守布局（conservative）</option><option>智能布局（smart）</option><option>原始布局（raw）</option><option>单根条目展平（flat-single）</option></select></label><label class="field">同名冲突<select><option>自动重命名</option><option>询问</option><option>跳过</option><option>覆盖</option></select></label><label class="field">最大递归层数<input type="number" min="0" value="8"></label></div><label class="check"><input type="checkbox" checked>递归解压嵌套压缩包</label><label class="field">根目录名称<select><option>自动（auto）</option><option>归档名（archive）</option><option>内部根名（inner）</option><option>保留两者（preserve-both）</option></select></label></div>`;if(state.settingsTab==='limits')panel=`<div class="settingsgroup"><h3>资源预算</h3><div class="formgrid"><label class="field">最大并发批次（默认 1）<input type="number" min="1" value="2"></label><label class="field">展开输出上限（GiB）<input type="number" value="20"></label><label class="field">最大条目数<input type="number" value="100000"></label><label class="field">最少剩余磁盘空间（MB）<input type="number" value="512"></label><label class="field">最大嵌套候选数量<input type="number" value="10000"></label></div></div><div class="settingsgroup"><h3>安全行为</h3><label class="check"><input type="checkbox" checked disabled>阻止绝对路径与越界路径</label><label class="check"><input type="checkbox" checked disabled>失败时清理暂存，提交失败时回滚</label><p class="settingNote">权限与符号链接策略沿用核心检查。</p></div>`;if(state.settingsTab==='advanced')panel=`<div class="settingsgroup"><h3>嵌入与递归</h3><div class="formgrid"><label class="field">根归档扫描模式<select><option>关闭（off）</option><option>自动（auto）</option><option>询问（ask）</option><option>全部（all）</option><option>最大候选（largest）</option></select></label><label class="field">嵌套归档扫描模式<select><option>关闭（off）</option><option>自动（auto）</option><option>询问（ask）</option><option>积极扫描（aggressive）</option><option>全部（all）</option><option>最大候选（largest）</option></select></label><label class="field">处理后嵌套归档<select><option>保留</option><option>移到废纸篓</option><option>删除</option></select></label><label class="field">遇到错误<select><option>停止当前任务</option><option>继续处理其余条目</option></select></label><label class="field">主导归档阈值<input type="number" value="0.8" step="0.1" min="0" max="1"></label><label class="field">大范围扫描<select disabled><option>确认字段尚未接线，无实际效果</option></select></label></div><label class="check"><input type="checkbox" checked>自动发现同组分卷</label><label class="check"><input type="checkbox" disabled>强制执行（force，当前无效果）</label><label class="check"><input type="checkbox" checked>记录任务历史</label></div>`;if(state.settingsTab==='backend')panel=`<div class="settingsgroup"><h3>后端选择</h3><label class="field">执行策略<select><option>自动选择可用后端</option><option>指定后端</option></select></label><div class="emptyline">7-Zip · 可用（模拟）<br>原生 ZIP · 可用（模拟）</div><div class="formgrid"><label class="field">文件名编码<select><option>自动检测</option><option>UTF-8</option><option>GB18030</option></select></label></div><p class="settingNote">能力详情、外部程序路径与诊断在正式实现中对接核心。</p><div class="row"><button type="button" data-act="diagnostics">查看引擎诊断</button><button type="button" data-act="effective">有效配置与来源</button><button type="button" data-act="restore">恢复默认值</button></div><p class="settingNote">应用前校验配置；旧配置需检查迁移结果。</p></div>`;return head('设置','默认设置仅应用于之后投递的批次。')+`<div class="pagebody"><div class="tabrow" aria-label="设置分类">${Object.entries(tabs).map(([key,label])=>`<button type="button" data-settingtab="${key}" aria-pressed="${state.settingsTab===key}">${label}</button>`).join('')}</div>${panel}<div class="row between"><span class="muted">当前为设计演示，不写入实际配置。</span><button type="button" class="primary" data-act="save">保存设置</button></div></div>`;}
function render(){content.innerHTML=({tasks:taskPage,history:historyPage,preview:previewPage,passwords:passwordsPage,settings:settingsPage})[state.page]();root.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('.sidebar'))b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false')});if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function mode(value){state.mode=value;root.querySelector('#sz-full').hidden=value!=='full';root.querySelector('#sz-quick').hidden=value!=='quick';root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===value)));}
function page(value){state.page=value;mode('full');render();}
function modal(kind){mode('full');const box=root.querySelector('#sz-modal');box.hidden=false;let body=kind==='password'?'<h2>工作文档.zip 需要密码</h2><p class="muted">本任务保存策略：不保存（提交时冻结）。</p><label class="field" style="margin:20px 0 8px">解压密码<input type="password" id="sz-password" autocomplete="off" placeholder="输入密码" required></label><p class="muted">运行中不能更改密码保存策略；可在新建任务前配置。</p>':kind==='newkey'?'<h2>添加候选密码</h2><label class="field" style="margin:18px 0 10px">名称<input id="sz-keyname" placeholder="例如：项目交付"></label><label class="field">密码<input type="password" id="sz-password" autocomplete="off" required></label>':'<h2>清理历史记录？</h2><p class="muted">仅清理任务记录，不删除归档或已解压文件。</p>';box.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="${kind==='clearhistory'?'清理历史记录':'密码输入'}">${body}<p id="sz-error" class="danger" role="alert"></p><div class="row" style="justify-content:flex-end;margin-top:22px"><button type="button" data-act="closemodal">取消</button><button type="button" class="primary" data-confirm="${kind}">${kind==='password'?'继续解压':kind==='newkey'?'保存':'清理记录'}</button></div></div>`;const focus=box.querySelector('input,button');focus?.focus();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode(b.dataset.mode);return;}if(b.dataset.page){page(b.dataset.page);return;}if(b.dataset.task!==undefined){state.selected=Number(b.dataset.task);render();return;}if(b.dataset.settingtab){state.settingsTab=b.dataset.settingtab;render();return;}if(b.dataset.deletekey!==undefined){state.keys.splice(Number(b.dataset.deletekey),1);render();notice('演示：已移除候选密码。');return;}if(b.dataset.confirm){const kind=b.dataset.confirm;if(kind!=='clearhistory'&&!root.querySelector('#sz-password').value){root.querySelector('#sz-error').textContent='请输入密码。';return;}if(kind==='password'){state.unlocked=true;tasks[1].detail='密码已提交，继续解压';root.querySelector('#sz-quick [data-act=password]').hidden=true;}if(kind==='newkey')state.keys.push('新候选密码');root.querySelector('#sz-modal').innerHTML='';root.querySelector('#sz-modal').hidden=true;render();notice(kind==='clearhistory'?'演示：历史清理请求已确认。':kind==='password'?'演示：已提交密码，任务在原有并发槽内继续解压。':'演示：候选密码已添加。');return;}
const act=b.dataset.act;if(act==='pause'){state.paused=!state.paused;render();notice(state.paused?'调度已暂停：不启动排队批次；当前解压继续。':'调度已恢复。');}if(act==='add'||act==='retry'){state.added++;render();notice(`演示：已新增 ${state.added} 个任务，${state.paused?'等待恢复调度':'等待可用资源'}。`);root.querySelector('#sz-quickcount').textContent=`另有 ${3+state.added} 个任务`;}if(act==='cancel'){state.canceled=true;render();const quickState=root.querySelector('#sz-quickstate');if(quickState)quickState.textContent='正在取消 / 清理';root.querySelector('#sz-quick .quicktask').innerHTML='<div class="filename">项目素材.7z</div><p class="muted">正在取消 / 清理（模拟） · 等待后端确认终态</p><p class="muted" id="sz-quickcount">另有 3 个任务</p>'; notice('演示：取消请求已提交，正在等待后端终止与清理完成。');}if(act==='applycleankeys'){root.querySelector('#sz-modal').hidden=true;root.querySelector('#sz-modal').innerHTML='';notice('演示：已禁用 1 个符合清理条件的候选；置顶候选保持启用。');}if(act==='password'||act==='newkey'||act==='clearhistory')modal(act);if(act==='closemodal'){root.querySelector('#sz-modal').hidden=true;root.querySelector('#sz-modal').innerHTML='';}if(act==='quickconfig'){const el=root.querySelector('#sz-quickconfig');el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));}if(act==='folder'){state.previewFolder=true;render();}if(act==='rootfolder'){state.previewFolder=false;render();}if(['test','encoding','embedded','diagnostics','effective','restore','filehistory','partial','importkeys','exportkeys','cleankeys','pin'].includes(act))info(act);if(act==='save')notice('演示：设置已保存，将应用于新任务。');if(act==='output')notice('演示：打开已完成任务的输出目录。');});
function info(kind){mode('full');const texts={test:['完整性测试','测试模式：完整性检查；启用分卷诊断。','<label class="field">损坏分卷诊断<select><option>自动（auto）</option><option>关闭（off）</option></select></label><label class="field" style="margin-top:12px">诊断时间预算（秒）<input type="number" value="30"></label><p class="muted">演示结果：归档测试通过，未发现损坏条目。</p>'],encoding:['文件名编码对比','检测到可疑编码时暂停并等待选择。','<label class="field">文件名解码<select><option>自动：UTF-8</option><option>GB18030</option></select></label><div class="emptyline">UTF-8：项目说明.pdf<br>GB18030：椤圭洰璇存槑.pdf</div>'],embedded:['发现内嵌归档','为识别到的内嵌归档选择操作；大扫描确认尚未接线。','<label class="field">处理范围<select><option>解压当前候选（Extract）</option><option>跳过（Skip）</option><option>解压全部（ExtractAll）</option></select></label>'],diagnostics:['引擎诊断','后端能力与路由（模拟）','<div class="emptyline">7-Zip：可用 · 版本 24.09（模拟）<br>支持：检测 / 列表 / 测试 / 解压<br>路由：7z → 7-Zip<br>压缩：未接入</div>'],effective:['有效配置与来源','保存前展示配置合并结果。','<div class="emptyline">递归解压：开启 · 来源：用户配置<br>冲突策略：自动重命名 · 来源：任务覆盖<br>编码：自动 · 来源：默认值</div>'],restore:['恢复默认设置','演示：恢复当前设置页的核心默认值。','<p class="muted">正式实现中应先展示变化，再应用。</p>'],filehistory:['设计交付.zip · 逐文件结果','已完成；条目结果与事件不记录密码。','<div class="emptyline">logo.svg　完成<br>cover.png　完成<br>README.md　完成</div>'],partial:['素材归档.zip · 部分完成','120 个完成 · 2 个跳过 · 1 个失败','<div class="emptyline">cover.png　完成<br>README.md　跳过：目标已存在<br>old-logo.svg　跳过：用户选择<br>textures.zip　失败：归档损坏</div><p class="muted">跳过与失败分别统计，任务终态为部分完成。</p>'],importkeys:['导入候选密码','本设计稿不读取文件。','<p class="muted">正式实现提供导入格式校验与去重结果。</p>'],exportkeys:['导出候选密码','导出文件包含明文密码。','<p class="muted">正式实现需明确选择导出位置，并确认明文内容。</p>'],cleankeys:['密码清理预览','根据核心建议查看低价值候选。','<div class="emptyline">将禁用陈旧候选 1 项 · 置顶候选受保护</div><p class="muted">应用后禁用符合清理条件的候选，不永久删除。</p><button type="button" class="primary" data-act="applycleankeys">应用清理（模拟）</button>'],pin:['候选密码置顶','演示：调整候选优先级。','<p class="muted">优先级变化应与核心排序一致。</p>']};const item=texts[kind];const box=root.querySelector('#sz-modal');box.hidden=false;box.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="${item[0]}"><h2>${item[0]}</h2><p class="muted">${item[1]}</p><div style="margin-top:18px">${item[2]}</div><div class="row" style="justify-content:flex-end;margin-top:20px"><button type="button" data-act="closemodal">关闭</button></div></div>`;box.querySelector('button,input,select')?.focus();}
root.addEventListener('keydown',e=>{if(e.key==='Escape'){root.querySelector('#sz-modal').hidden=true;root.querySelector('#sz-modal').innerHTML='';}});
const drop=root.querySelector('#sz-drop');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');state.added++;root.querySelector('#sz-quickcount').textContent=`另有 ${3+state.added} 个任务（模拟）`;render();notice('演示：已模拟添加任务，未读取拖入文件。')});
render();function design(){root.querySelectorAll('.window').forEach(el=>el.style.borderRadius=state.radius+'px');root.style.setProperty('--sz-accent',state.accent==='森林绿'?'light-dark(#276c60,#7ad1b8)':'light-dark(#386bc4,#96b9ff)');root.querySelectorAll('.task').forEach(el=>el.style.padding=state.density==='紧凑'?'9px 12px':'14px 12px');}if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:design});tweak.addSelect(state,'accent',{label:'强调色',options:['森林绿','清晰蓝']});tweak.addSelect(state,'density',{label:'任务密度',options:['舒适','紧凑']});tweak.addSlider(state,'radius',{label:'窗口圆角',min:4,max:20,unit:'px'});}
})();
</script>
