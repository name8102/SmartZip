[target.aarch64-apple-darwin]
linker = "clang"

[env]
RUST_TEST_THREADS = "1"

# Keep backtrace line numbers and incremental state without full debug info.
# Tests inherit dev; release/bench profiles retain their existing settings.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

# Opt in to variable/type debugging with `cargo build --profile debugging`.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true
