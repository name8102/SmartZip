name: Beta release
on:
  push:
    branches: [main]
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip zip ripgrep pkg-config liblzma-dev libbz2-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev clang
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sevenzip xz pkg-config ripgrep
      - name: Toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          rustc --version --verbose
          command -v 7z || command -v 7zz
      - name: Format and routing contracts
        run: |
          cargo fmt --all --check
          bash scripts/check_routing_guards.sh
      - name: Workspace and GUI worker tests (no native windows)
        run: |
          cargo test --workspace --locked
          cargo test --locked -p smartzip-gui --test runtime_worker -- --ignored
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build CLI and GUI
        run: cargo build --release --locked -p smartzip-cli -p smartzip-gui --target ${{ matrix.target }}
      - name: Package and verify unpacked binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/package_cli_beta.py "target/$TARGET/release/smartzip" "$TARGET" dist
          python3 scripts/package_desktop_beta.py "target/$TARGET/release/smartzip" "target/$TARGET/release/smartzip-gui" "$TARGET" dist
          scratch=$(mktemp -d)
          tar -xzf dist/smartzip-desktop-*.tar.gz -C "$scratch"
          binary=$(find "$scratch" -path '*/bin/smartzip' -type f)
          cli_archive=$(find dist -name 'smartzip-*.tar.gz' ! -name 'smartzip-desktop-*')
          tar -xzf "$cli_archive" -C "$scratch"
          cli_binary=$(find "$scratch" -mindepth 2 -maxdepth 2 -name smartzip -type f)
          cmp "$binary" "$cli_binary"
          mkdir -p reports
          python3 scripts/verify_cli_beta.py "$binary" | tee reports/cli.json
          python3 scripts/verify_review_fixes.py "$binary" | tee reports/regressions.json
          python3 scripts/verify_recovery.py "$binary" | tee reports/recovery.json
          python3 scripts/verify_resource_bounds.py "$binary" | tee reports/resources.json
          python3 scripts/verify_desktop_package.py dist/smartzip-desktop-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verification-${{ matrix.target }}
          path: reports/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: beta-*
          merge-multiple: true
          path: dist
      - name: Verify version, checksums and publish beta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,tomllib; v=tomllib.load(open("crates/smartzip-cli/Cargo.toml","rb"))["package"]["version"]; assert os.environ["TAG"] == "v"+v and "-beta." in v'
          (cd dist && sha256sum -c *.sha256)
          gh release create "$TAG" dist/* --verify-tag --prerelease --title "SmartZip $TAG beta" --notes-file docs/cli-beta-release-notes.md
